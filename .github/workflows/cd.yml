name: FastAPI CD (Build & Push Docker)

on:
  push:
    branches: [ "deployment" ]
  merge-request:
    branches: [ "deployment" ] 
jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Kéo code về runner
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Thiết lập Docker Buildx (tối ưu hóa build và cache layer)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Đăng nhập vào Docker Hub bằng Secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # 4. Build và Push Docker Image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/docker_demo:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/docker_demo:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
