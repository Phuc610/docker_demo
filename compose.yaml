services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017" 
    volumes:
      - mongo_data:/data/db 

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    ports:
      - "8081:8081" 
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb 
      - ME_CONFIG_BASICAUTH=false 
    restart: always

  my-app:
    build: .
    image: my-app:1.0 
    container_name: my-fastapi-app
    ports:
      - "8000:8000" 
    environment:
      - MONGO_URI=mongodb://mongodb:27017 
    depends_on:
      - mongodb # Chờ MongoDB khởi động trước
    restart: on-failure
volumes:
  mongo_data: # Khai báo volume lưu trữ dữ liệu
